<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lúcid · Entrena tu mente</title>
<meta name="description" content="Entrenamiento mental diario: cálculo, memoria, atención, lenguaje y más. Gratis, sin registro, en español, catalán e inglés.">
<meta name="author" content="Marc Pàmpols">
<meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Lúcid">
<meta property="og:description" content="Entrena lo que la IA te está haciendo olvidar. Gratis y sin registro.">
<meta property="og:url" content="https://mpampols.github.io/lucid/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/progress.css">
<link rel="stylesheet" href="css/play.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/share.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">

<script type="module" src="js/main.js"></script>
</head>
<body>
<noscript><p style="padding:24px;font-family:system-ui,sans-serif">Lúcid necesita JavaScript para funcionar. · Lúcid needs JavaScript to run.</p></noscript>
<div id="app">
  <div id="chrome">
    <header class="topbar">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="var(--accent)"/><path d="M15 6c.8 4.6 3.4 7.2 8 8-4.6.8-7.2 3.4-8 8-.8-4.6-3.4-7.2-8-8 4.6-.8 7.2-3.4 8-8z" fill="#fff"/></svg>
        Lúcid
      </div>
      <span class="pill flame" id="streakPill"></span>
      <select class="lang" id="lang" aria-label="Idioma / Language / Idioma">
        <option value="es">ES</option><option value="ca">CA</option><option value="en">EN</option>
      </select>
      <button class="icon-btn" id="soundBtn"></button>
    </header>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabHome" data-view="home"></button>
      <button class="tab" role="tab" id="tabStats" data-view="stats"></button>
    </nav>
  </div>

  <main id="home"></main>
  <main id="stats" hidden></main>

  <footer class="foot" id="siteFoot">
    <p id="footNote"></p>
    <p class="credit"><span id="footBy"></span> <a href="https://marcpampols.net" target="_blank" rel="noopener">Marc Pàmpols</a> · <a href="https://github.com/mpampols/lucid" target="_blank" rel="noopener" id="footCode"></a></p>
  </footer>

  <section id="play" hidden>
    <div class="play-top">
      <button class="icon-btn" id="quit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="track" id="track"><div class="fill" id="fill"></div></div>
      <div class="hud" id="hud" aria-live="polite"></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>
</div>
<canvas id="confetti" hidden></canvas>
<div id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>

</body>
</html>
