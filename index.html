<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lúcid · Entrena tu mente</title>
<meta name="description" content="Entrenamiento mental diario: cálculo, memoria, atención, lenguaje y más. Gratis, sin registro, en español, catalán e inglés.">
<meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='9' fill='%23FF5C39'/%3E%3Cpath d='M15 6c.8 4.6 3.4 7.2 8 8-4.6.8-7.2 3.4-8 8-.8-4.6-3.4-7.2-8-8 4.6-.8 7.2-3.4 8-8z' fill='%23fff'/%3E%3C/svg%3E">
<meta property="og:title" content="Lúcid">
<meta property="og:description" content="Entrena lo que la IA te está haciendo olvidar. Gratis y sin registro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one centred app column, mobile-first; chunky "pressable" cards and buttons on a cool canvas */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#151A30; --muted:#626A85; --line:#DFE3EE; --line-deep:#C7CDDC; --grid:#E9ECF3;
  --accent:#FF5C39; --accent-deep:#D63F1D; --on-accent:#FFFFFF;
  --ok:#17A35E; --ok-deep:#0F8048; --bad:#E5484D; --bad-deep:#B8343A;
  --d-math:#12A399; --d-attn:#EFA20E; --d-mem:#7A5CFA; --d-lang:#E8487E; --d-space:#2D8CFF; --d-speed:#17A35E; --d-flex:#6AA613;
  --c-red:#E5484D; --c-blue:#2D6CF6; --c-green:#16A05A; --c-yellow:#E3A008;
  --f-display:'Bricolage Grotesque','Nunito Sans',system-ui,sans-serif;
  --f-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B2E; --ink:#EEF0F8; --muted:#9AA1BC; --line:#272D46; --line-deep:#1C2135; --grid:#222842;
  --accent:#FF6A48; --accent-deep:#C4401F; --ok:#22B56C; --ok-deep:#148049; --bad:#F0565B; --bad-deep:#B3363B;
  --c-blue:#4D84FF; --c-yellow:#F2B90D; --c-green:#22B56C; --c-red:#F0565B; --d-flex:#7DBB1F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2E; --ink:#EEF0F8; --muted:#9AA1BC; --line:#272D46; --line-deep:#1C2135; --grid:#222842;
  --accent:#FF6A48; --accent-deep:#C4401F; --ok:#22B56C; --ok-deep:#148049; --bad:#F0565B; --bad-deep:#B3363B;
  --c-blue:#4D84FF; --c-yellow:#F2B90D; --c-green:#22B56C; --c-red:#F0565B; --d-flex:#7DBB1F;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;min-height:100%;display:flex;flex-direction:column}

/* ---------- top bar + tabs ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font:800 1.55rem var(--f-display);letter-spacing:-.03em}
.brand svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-variant-numeric:tabular-nums}
.pill.flame{color:var(--accent)}
.pill.flame.off{color:var(--muted)}
.lang{appearance:none;-webkit-appearance:none;height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:800 .85rem var(--f-body);letter-spacing:.04em;cursor:pointer}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);background:var(--surface);flex:none}
.icon-btn:active{transform:translateY(1px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--line);margin-bottom:16px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:0;border-radius:12px;background:transparent;font:800 .98rem var(--f-display);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line-deep)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:15px 22px;font:800 1.05rem var(--f-display);letter-spacing:.01em;background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-deep);transition:transform .06s, box-shadow .06s, filter .15s;margin-bottom:5px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.danger{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep)}
.btn.small{padding:11px 16px;font-size:.95rem;border-radius:13px}
.btn.wide{width:100%}
.btn-row{display:flex;flex-direction:column;gap:8px;width:100%}

/* ---------- home ---------- */
.lede{font:700 1.15rem var(--f-display);color:var(--muted);margin-bottom:14px;max-width:34ch;text-wrap:balance}
.daily{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:24px;padding:20px;display:grid;gap:20px}
.daily h2{font-size:1.65rem;margin-top:4px}
.daily .muted{margin-top:4px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:relative}
.path::before{content:"";position:absolute;left:12.5%;right:12.5%;top:29px;height:4px;border-radius:4px;background:var(--line)}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.node{position:relative;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:var(--dc);color:#fff;box-shadow:0 5px 0 color-mix(in oklab,var(--dc) 70%,#000)}
.node.todo{filter:saturate(.25);opacity:.55}
.node.cur{animation:bob 1.8s ease-in-out infinite}
.node .check{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;border:3px solid var(--surface)}
.node-label{font-size:.74rem;font-weight:700;text-align:center;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.stats-line{display:flex;flex-wrap:wrap;gap:8px 20px;padding:14px 4px 4px;font-size:.92rem;color:var(--muted)}
.stats-line b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 2px 12px}
.sec-head h3{font-size:1.3rem}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){ .games{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:559px){ .game:last-child:nth-child(odd){grid-column:span 2} }
.game{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;transition:transform .06s,border-color .15s;min-width:0}
.game:hover{border-color:var(--line-deep)}
.game:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.tile-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--dc);color:#fff;box-shadow:0 4px 0 color-mix(in oklab,var(--dc) 70%,#000);flex:none}
.game h4{margin:2px 0 0;font:800 1.05rem var(--f-display);letter-spacing:-.01em}
.game .dom{font-size:.8rem;font-weight:700;color:var(--muted)}
.game .best{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:800 .62rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;vertical-align:3px}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center;text-wrap:balance}

/* ---------- progress ---------- */
.prog{display:grid;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.card h3{font-size:1.2rem}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tiles4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){ .tiles4{grid-template-columns:repeat(4,minmax(0,1fr))} }
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:800 2rem var(--f-display);letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:.82rem;font-weight:700;color:var(--muted);line-height:1.25}
.stat.hot b{color:var(--accent)}

.heat{display:grid;grid-template-columns:auto repeat(16,minmax(0,1fr));gap:3px;align-items:center}
.heat .ml{font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap;height:16px;line-height:16px;overflow:visible}
.heat .dl{font-size:.68rem;font-weight:700;color:var(--muted);padding-right:4px;text-align:right}
.hc{aspect-ratio:1;border-radius:4px;background:var(--grid);min-width:0}
.hc.l1{background:color-mix(in oklab,var(--accent) 30%,var(--surface))}
.hc.l2{background:color-mix(in oklab,var(--accent) 55%,var(--surface))}
.hc.l3{background:color-mix(in oklab,var(--accent) 78%,var(--surface))}
.hc.l4{background:var(--accent)}
.hc.fut{background:transparent}
.hc.today{outline:2px solid var(--ink);outline-offset:1px}
.heat-key{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:.75rem;color:var(--muted);font-weight:700}
.heat-key .hc{width:12px;height:12px;aspect-ratio:auto}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px 12px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:800 .88rem var(--f-body);color:var(--muted)}
.chip .dot{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--dc);color:#fff}
.chip .dot svg{width:15px;height:15px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip[disabled]{opacity:.45;cursor:default}
.chart{position:relative;min-height:220px}
.chart svg{display:block;width:100%;height:220px;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .lbl{font-weight:800;fill:var(--ink);font-size:12px}
.chart-empty{display:grid;place-items:center;min-height:180px;text-align:center;color:var(--muted);padding:20px;border-radius:14px;background:var(--bg);text-wrap:balance}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:.8rem;font-weight:700;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:2}
.tip b{font-variant-numeric:tabular-nums}
.chart-foot{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.chart-foot b{color:var(--ink);font-variant-numeric:tabular-nums}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:390px}
.tbl th{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl .gname{display:flex;align-items:center;gap:9px;font-weight:800}
.tbl .gname .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--dc);color:#fff;flex:none}
.tbl .gname .dot svg{width:14px;height:14px}
.trend{white-space:nowrap}
.trend.up{color:var(--ok)}
.trend.down{color:var(--bad)}
.trend.flat,.na{color:var(--muted)}

.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr) 2.6rem;align-items:center;gap:10px;font-size:.9rem;font-weight:700}
.bar-row .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;border-radius:0 4px 4px 0;position:relative}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.bar-row .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-base{border-left:1px solid var(--line-deep)}

.data-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.data-actions .btn{flex:1 1 200px}
.restore{display:grid;gap:10px;margin-top:14px}
.restore textarea{width:100%;min-height:110px;resize:vertical;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;font:600 .8rem ui-monospace,SFMono-Regular,Menlo,monospace}
.restore .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.file-lbl{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.file-lbl input{position:absolute;width:1px;height:1px;opacity:0}
.confirm{margin-top:14px;padding:14px;border-radius:16px;border:2px solid var(--bad);background:color-mix(in oklab,var(--bad) 8%,var(--surface));display:grid;gap:12px}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}
.storage-note{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted);max-width:60ch}
.storage-note svg{flex:none;margin-top:2px}

.empty-prog{text-align:center;padding:30px 20px;display:grid;gap:14px;justify-items:center}
.empty-prog p{max-width:32ch;color:var(--muted);text-wrap:balance}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:.92rem;z-index:10;max-width:calc(100% - 32px);text-align:center;animation:pop .2s ease-out}

/* ---------- play ---------- */
#play{flex:1;display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.play-top{display:flex;align-items:center;gap:12px;padding-block:6px 10px}
.track{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:100%;border-radius:99px;background:var(--accent);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.fill.low{background:var(--bad)}
.hud{display:flex;align-items:center;gap:6px;font:800 1.1rem var(--f-display);font-variant-numeric:tabular-nums;min-width:56px;justify-content:flex-end}
.hearts{display:flex;gap:3px;color:var(--bad)}
.hearts .lost{color:var(--line)}
.stage{flex:1;display:flex;flex-direction:column;position:relative;gap:14px;padding-block:6px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:200px}
.hint{font-weight:800;color:var(--muted);font-size:.95rem}

.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding-block:20px}
.intro .tile-ic{width:88px;height:88px;border-radius:28px;margin-bottom:8px;box-shadow:0 7px 0 color-mix(in oklab,var(--dc) 70%,#000)}
.intro .tile-ic svg{width:44px;height:44px}
.intro h2{font-size:2.2rem}
.intro p{max-width:34ch;font-size:1.08rem}
.why{display:inline-block;margin-top:6px;padding:8px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:.9rem;color:var(--muted);max-width:36ch}
.why b{color:var(--ink)}

.prompt{font:800 clamp(2.6rem,13vw,4.2rem) var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.answer{min-width:3.2ch;padding:6px 18px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font:800 2.4rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);transition:border-color .1s,color .1s}
.answer.typing{color:var(--ink);border-color:var(--line-deep)}
.answer.ok{color:var(--ok);border-color:var(--ok)}
.answer.bad{color:var(--bad);border-color:var(--bad)}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transition:opacity .2s}
.keypad.off{opacity:.35;pointer-events:none}
.key{height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font:800 1.5rem var(--f-display);font-variant-numeric:tabular-nums;transition:transform .05s,box-shadow .05s}
.key:active,.key.pressed{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.key.soft{color:var(--muted)}
.key-space{visibility:hidden}

.stroop-word{font:800 clamp(2.8rem,14vw,4.6rem) var(--f-display);letter-spacing:.01em}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--line);font:800 1.05rem var(--f-display);letter-spacing:.04em;transition:transform .05s,box-shadow .05s;padding:6px}
.choice:active,.choice.pressed{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.choice kbd{font:700 .7rem var(--f-body);color:var(--muted);margin-left:6px}

.flash-digit{font:800 7rem var(--f-display);height:1.1em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--d-mem)}
.flash-digit.in{animation:pop .25s ease-out}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.slot{width:clamp(28px,9vw,42px);height:52px;display:grid;place-items:center;border-bottom:4px solid var(--line);font:800 1.7rem var(--f-display);font-variant-numeric:tabular-nums}
.slot.filled{border-color:var(--ink)}
.slot.miss{border-color:var(--bad);color:var(--bad)}
.slots.ok .slot{border-color:var(--ok);color:var(--ok)}

.grid{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;width:min(100%,340px);aspect-ratio:1;max-width:100%}
.cell{border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);transition:background .12s,transform .06s}
.cell:active{transform:translateY(2px)}
.cell.lit{background:var(--d-space);border-color:color-mix(in oklab,var(--d-space) 70%,#000)}
.cell.hit{background:var(--ok);border-color:var(--ok-deep)}
.cell.miss{background:var(--bad);border-color:var(--bad-deep)}
.grid.locked .cell{pointer-events:none}

.built{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.built .slot{width:clamp(30px,10vw,44px)}
.built.ok .slot{border-color:var(--ok);color:var(--ok)}
.built.bad .slot{border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px}
.tile{width:clamp(40px,12vw,54px);height:clamp(46px,13vw,58px);border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--line);font:800 1.5rem var(--f-display);transition:transform .05s,box-shadow .05s,opacity .15s}
.tile:active{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.tile.used{opacity:.18;pointer-events:none;box-shadow:none;transform:translateY(5px)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.opt{min-height:150px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;font:800 clamp(1.3rem,6vw,1.9rem) var(--f-display);font-variant-numeric:tabular-nums;transition:transform .05s,box-shadow .05s,border-color .1s}
.opt:active{transform:translateY(6px);box-shadow:0 0 0 var(--line)}
.opt small{font:700 .95rem var(--f-body);color:var(--muted);min-height:1.4em}
.opt.win{border-color:var(--ok)}
.opt.win small{color:var(--ok)}
.opt.lose{border-color:var(--bad)}

/* Reglas */
.rule-card{width:min(100%,300px);border-radius:26px;border:4px solid var(--rc);background:color-mix(in oklab,var(--rc) 10%,var(--surface));padding:18px 16px 26px;display:grid;gap:10px;justify-items:center;transition:border-color .15s,background .15s}
.rule-chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--rc);color:#fff;font:800 .88rem var(--f-body);letter-spacing:.02em}
.rule-num{font:800 6rem var(--f-display);line-height:1;font-variant-numeric:tabular-nums}

/* Eco (n-back) */
.nb-card{width:150px;height:150px;border-radius:30px;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;font:800 5.4rem var(--f-display);color:var(--d-mem);transition:border-color .12s}
.nb-card.ok{border-color:var(--ok)}
.nb-card.bad{border-color:var(--bad)}
.nb-level{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--muted);font-size:.9rem;min-height:1.5em}
.nb-dots{display:flex;gap:5px}
.nb-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.nb-dots i.on{background:var(--d-mem)}
.nb-note{min-height:1.4em;font-weight:800;font-size:.9rem;color:var(--bad)}

/* Espejo */
.shapes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.shape-box{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;padding:8%}
.shape-box svg{width:100%;height:100%;overflow:visible}
.shape-box.ok{border-color:var(--ok)}
.shape-box.bad{border-color:var(--bad)}

.flash-ok{animation:okglow .35s ease-out}
.shake{animation:shake .35s}
@keyframes okglow{0%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
.pts{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:800 1.3rem var(--f-display);color:var(--ok);pointer-events:none;animation:rise .7s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}

/* ---------- result ---------- */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-block:20px}
.score-big{font:800 clamp(4rem,22vw,6.5rem) var(--f-display);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:color-mix(in oklab,var(--ok) 16%,var(--surface));color:var(--ok);font-weight:800;font-size:.9rem}
.res-stats{display:flex;gap:10px;margin:14px 0 8px}
.res-stats div{min-width:110px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.res-stats b{display:block;font:800 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.res-stats span{font-size:.8rem;color:var(--muted);font-weight:700}
.sum-list{list-style:none;margin:12px 0;padding:0;width:100%;display:grid;gap:8px}
.sum-list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left}
.sum-list .tile-ic{width:36px;height:36px;border-radius:11px;box-shadow:none}
.sum-list .tile-ic svg{width:20px;height:20px}
.sum-list span{flex:1;font-weight:800;min-width:0}
.sum-list b{font:800 1.1rem var(--f-display);font-variant-numeric:tabular-nums}
.big-flame{color:var(--accent);animation:pop .4s ease-out}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* =========================================================
   Almacenamiento
   Toda la persistencia pasa por Store. Hoy usa localStorage;
   el día que haya backend, solo cambia este módulo.
   Esquema v2:
   { v, lang, sound,
     best:{gameId:score},
     streak:{count,last,best},
     days:{ 'YYYY-MM-DD': {plan:[ids], games:{id:score}, done, total} },
     history:[ {t, d, g, s, c, w, daily} ] }   // una entrada por partida
   ========================================================= */
const Store = {
  KEY:'lucid.v2', LEGACY:'lucid.v1', MAX_HISTORY:5000,
  defaults(){ return {v:2, lang:detectLang(), sound:true, best:{}, streak:{count:0,last:null,best:0}, days:{}, history:[]}; },
  normalize(o){
    const d=this.defaults(), s=Object.assign(d, o||{});
    s.v=2; s.best=s.best||{}; s.days=s.days||{}; s.history=Array.isArray(s.history)?s.history:[];
    s.streak=Object.assign({count:0,last:null,best:0}, s.streak||{});
    s.streak.best=Math.max(s.streak.best||0, s.streak.count||0);
    if(!T[s.lang]) s.lang=d.lang;
    return s;
  },
  migrateV1(o){
    const s=this.normalize(o);
    // Reconstruye el historial a partir de los días guardados en v1
    Object.entries(s.days).forEach(([d,day])=>{
      Object.entries(day.games||{}).forEach(([g,score])=>{
        s.history.push({t:new Date(d+'T12:00:00').getTime(), d, g, s:score, c:null, w:null, daily:true});
      });
    });
    s.history.sort((a,b)=>a.t-b.t);
    return s;
  },
  load(){
    try{
      const raw=localStorage.getItem(this.KEY);
      if(raw) return this.normalize(JSON.parse(raw));
      const old=localStorage.getItem(this.LEGACY);
      if(old){ const s=this.migrateV1(JSON.parse(old)); this.save(s); return s; }
    }catch(e){}
    return this.defaults();
  },
  save(s){
    if(s.history.length>this.MAX_HISTORY) s.history=s.history.slice(-this.MAX_HISTORY);
    try{ localStorage.setItem(this.KEY, JSON.stringify(s)); }catch(e){}
  },
  exportText(s){ return JSON.stringify({app:'lucid', v:2, exportedAt:new Date().toISOString(), data:s}); },
  parseBackup(text){
    try{
      const o=JSON.parse(text.trim());
      const data = o && o.app==='lucid' ? o.data : o;
      if(!data || typeof data!=='object' || !('best' in data || 'history' in data || 'days' in data)) return null;
      return data.history ? this.normalize(data) : this.migrateV1(data);
    }catch(e){ return null; }
  },
  reset(keep){ const s=this.defaults(); s.lang=keep.lang; s.sound=keep.sound; this.save(s); return s; }
};
function detectLang(){ const l=(navigator.language||'es').toLowerCase(); return l.startsWith('ca')?'ca':l.startsWith('en')?'en':'es'; }

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let x=Math.imul(seed^seed>>>15,1|seed); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }

// Plan diario: igual para todos ese día, sin repetir área
function dailyPlan(key){
  const r=seeded(hash('lucid'+key)), a=[...ORDER];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  const out=[], used=new Set();
  for(const id of a){ if(out.length<DAILY_N && !used.has(GAMES[id].domain)){ out.push(id); used.add(GAMES[id].domain); } }
  return out;
}
function getDay(){ const k=dayKey(); if(!S.days[k]) S.days[k]={plan:dailyPlan(k), games:{}, done:false}; S.days[k].plan=S.days[k].plan.filter(id=>GAMES[id]); return S.days[k]; }
function currentStreak(){ const l=S.streak.last; return (l===dayKey()||l===yesterdayKey()) ? S.streak.count : 0; }
function bumpStreak(){ const k=dayKey(); if(S.streak.last===k) return; S.streak.count = S.streak.last===yesterdayKey() ? S.streak.count+1 : 1; S.streak.last=k; S.streak.best=Math.max(S.streak.best||0,S.streak.count); }

function heatHTML(){
  const L=t(), counts={};
  S.history.forEach(e=>{ counts[e.d]=(counts[e.d]||0)+1; });
  const today=new Date(); today.setHours(12,0,0,0);
  const dow=(today.getDay()+6)%7; // lunes = 0
  const start=new Date(today); start.setDate(today.getDate()-dow-15*7);
  const tk=dayKey(today);
  let html='<span></span>', prevMonth=-1, lastLbl=-9;
  for(let w=0; w<16; w++){
    const d=new Date(start); d.setDate(start.getDate()+w*7);
    const m=d.getMonth();
    const show = m!==prevMonth && w<15 && w-lastLbl>=3;
    if(show) lastLbl=w;
    html+=`<span class="ml">${show ? d.toLocaleDateString(L.locale,{month:'short'}).replace('.','') : ''}</span>`;
    prevMonth=m;
  }
  for(let r=0; r<7; r++){
    const ld=new Date(start); ld.setDate(start.getDate()+r);
    html+=`<span class="dl">${r%2===0 ? ld.toLocaleDateString(L.locale,{weekday:'narrow'}) : ''}</span>`;
    for(let w=0; w<16; w++){

function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))), f=x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function drawLine(){

    return;
  }
  const W=Math.max(280, box.clientWidth), H=220, m={l:40,r:14,t:22,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const maxRaw=Math.max(st.best, ...pts.map(p=>p.s), 10), step=niceStep(maxRaw/4), maxV=step*Math.ceil(maxRaw/step);
  const X=i=>m.l + i*iw/(pts.length-1), Y=v=>m.t+ih-v/maxV*ih;
  let g='';
  for(let v=0; v<=maxV+1e-9; v+=step){ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v>=1000?(v/1000)+'K':v}</text>`; }
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.s).toFixed(1)}`).join('');
  const area=`${line}L${X(pts.length-1)},${Y(0)}L${X(0)},${Y(0)}Z`;

    <line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--line-deep)" stroke-width="1" visibility="hidden"/>
    <circle id="xd" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5" visibility="hidden"/>

let run = null;

function renderIntro(){
  const L=t(), g=GAMES[run.id], info=L.games[run.id];
  $('#track').style.visibility='hidden'; $('#hud').innerHTML='';
  $('#quit').setAttribute('aria-label',L.quit);

  if(run.daily){ const plan=getDay().plan; label=L.step(plan.indexOf(run.id)+1, plan.length); }
  stage.innerHTML = `
    <div class="intro" style="--dc:var(--d-${g.domain})">

  $('#go').onclick=startRun; $('#go').focus({preventScroll:true});

function startRun(){
  const g=GAMES[run.id];
  Object.assign(run,{phase:'game', score:0, correct:0, wrong:0, lives:g.lives??null, onKey:null, timers:[], lastTick:null});
  stage.innerHTML='';
  $('#track').style.visibility = g.time ? 'visible' : 'hidden';
  sfx.tap();
  hud();
  run.cleanup = g.init(stage, api) || null;
  if(g.time){ run.total=g.time*1000; run.endAt=performance.now()+run.total; run.raf=requestAnimationFrame(loop); }
}

function loop(){
  if(!run||run.phase!=='game') return;
  const left=Math.max(0, run.endAt-performance.now());
  const fill=$('#fill'); fill.style.width=(left/run.total*100)+'%'; fill.classList.toggle('low', left<6000);
  const sec=Math.ceil(left/1000);
  if(sec<=5 && left>0 && sec!==run.lastTick){ run.lastTick=sec; sfx.tick(); }
  if(left<=0){ finish(); return; }
  run.raf=requestAnimationFrame(loop);
}

function hud(){
  const h=$('#hud'); if(!run) return;
  const hearts = run.lives!=null ? `<span class="hearts">${[0,1,2].map(i=>heartSVG(i>=run.lives)).join('')}</span>` : '';
  h.innerHTML = hearts + `<span>${run.score}</span>`;
}

function popPoints(p){ const el=document.createElement('div'); el.className='pts'; el.textContent='+'+p; stage.appendChild(el); setTimeout(()=>el.remove(),750); }

const api = {
  t,
  alive:()=>!!run && run.phase==='game',
  correct(p){ if(!api.alive()) return; run.score+=p; run.correct++; sfx.ok(); hud(); popPoints(p); },
  wrong(){ if(!api.alive()) return false; run.wrong++; sfx.bad();
    if(run.lives!=null){ run.lives--; hud(); if(run.lives<=0){ run.phase='ending'; setTimeout(()=>finish(),1100); return false; } }
    return true; },
  later(fn,ms){ const id=setTimeout(()=>{ if(api.alive()) fn(); },ms); run.timers.push(id); },
  key(fn){ run.onKey=fn; }
};

function stopRun(){
  if(!run) return;
  cancelAnimationFrame(run.raf); (run.timers||[]).forEach(clearTimeout); run.timers=[];
  if(run.cleanup) try{ run.cleanup(); }catch(e){}
  run.cleanup=null; run.onKey=null;
}
function abortRun(){ if(run && (run.phase==='game'||run.phase==='ending')){ stopRun(); run.phase='aborted'; } }

function finish(){
  if(!run || (run.phase!=='game' && run.phase!=='ending')) return;
  stopRun(); run.phase='result';
  const id=run.id, score=run.score, k=dayKey();
  const isBest = score>0 && score>(S.best[id]||0); if(isBest) S.best[id]=score;
  S.history.push({t:Date.now(), d:k, g:id, s:score, c:run.correct, w:run.wrong, daily:!!run.daily});
  let dayCompleted=false;
  if(run.daily){
    const day=getDay();
    if(!(id in day.games)) day.games[id]=score;
    if(!day.done && day.plan.every(x=>x in day.games)){ day.done=true; day.total=day.plan.reduce((a,x)=>a+day.games[x],0); bumpStreak(); dayCompleted=true; }
  }
  save();
  renderResult(isBest, dayCompleted);
}

function renderResult(isBest, dayCompleted){
  const L=t(), info=L.games[run.id];
  $('#track').style.visibility='hidden'; $('#hud').innerHTML='';
  const day=getDay(), nextId=day.plan.find(x=>!(x in day.games));

// 1) Cálculo mental — dificultad adaptativa
function initMath(st, api){
  let level=1, streak=0, ans=0, input='', lock=false;
  st.innerHTML = `<div class="mid"><div class="prompt" id="q"></div><div class="answer" id="a">?</div></div>${keypadHTML()}`;
  const q=$('#q',st), a=$('#a',st);
  function gen(){
    const ops = level<2?['+','−'] : level<4?['+','−','×'] : ['+','−','×','÷'];
    const max = [0,12,20,35,50,80,120][Math.min(level,6)];
    const op=pick(ops); let x,y;
    if(op==='+'){ x=ri(2,max); y=ri(2,max); ans=x+y; }
    else if(op==='−'){ x=ri(4,max); y=ri(1,x-1); ans=x-y; }
    else if(op==='×'){ x=ri(2,level<5?9:13); y=ri(2,level<5?9:12); ans=x*y; }
    else { y=ri(2,level<6?9:12); ans=ri(2,level<6?10:13); x=y*ans; }
    q.textContent=`${x} ${op} ${y}`; bump(q,'flash-ok');
    input=''; a.textContent='?'; a.className='answer';
  }
  function press(k){
    if(lock) return;
    if(k==='del') input=input.slice(0,-1);
    else { if(input.length>=5) return; input+=k; }
    a.textContent=input||'?'; a.className='answer'+(input?' typing':'');
    if(!input) return;
    if(+input===ans){
      lock=true; a.className='answer ok'; api.correct(5+5*level);
      if(++streak>=3 && level<6){ level++; streak=0; }
      api.later(()=>{ lock=false; gen(); },220);
    } else if(k!=='del' && input.length>=String(ans).length){
      lock=true; a.className='answer bad'; a.textContent=ans; bump(a,'shake'); api.wrong();
      streak=0; level=Math.max(1,level-1);
      api.later(()=>{ lock=false; gen(); },800);
    }
  }
  bindKeypad(st, press); gen();
}

// 2) Tinta — efecto Stroop
function initStroop(st, api){
  const keys=['red','blue','green','yellow'], names=api.t().colors; let ink, lock=false;
  st.innerHTML = `<div class="mid"><div class="hint">${api.t().tapInk}</div><div class="stroop-word" id="w"></div></div>
    <div class="choices">${keys.map((k,i)=>`<button class="choice" data-c="${k}">${names[k]}<kbd>${i+1}</kbd></button>`).join('')}</div>`;
  const w=$('#w',st);
  function next(){
    const word=pick(keys); ink = Math.random()<.25 ? word : pick(keys.filter(k=>k!==word));
    w.textContent=names[word]; w.style.color=`var(--c-${ink})`; bump(w,'flash-ok');
  }
  function choose(k, btn){
    if(lock) return;
    if(k===ink){ api.correct(10); next(); }
    else { lock=true; api.wrong(); if(btn) bump(btn,'shake'); bump(w,'shake'); api.later(()=>{ lock=false; next(); },450); }
  }
  st.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.c,b));
  api.key(e=>{ const i=+e.key-1; if(i>=0&&i<4){ e.preventDefault(); choose(keys[i], st.querySelectorAll('.choice')[i]); } });
  next();
}

// 3) Dígitos — amplitud de dígitos
function initDigits(st, api){
  const L=api.t(); let len=3, seq=[], input=[], phase='show', fails=0;
  st.innerHTML = `<div class="mid"><div class="hint" id="h"></div><div class="flash-digit" id="d"></div><div class="slots" id="s"></div></div>${keypadHTML()}`;
  const h=$('#h',st), d=$('#d',st), s=$('#s',st), kp=$('.keypad',st);
  const slots=()=>{ s.innerHTML=seq.map((_,i)=>`<span class="slot ${i<input.length?'filled':''}">${input[i]??''}</span>`).join(''); };
  function round(){
    seq=[]; while(seq.length<len){ const n=ri(0,9); if(n!==seq[seq.length-1]) seq.push(n); }
    input=[]; phase='show'; kp.classList.add('off'); s.className='slots'; s.innerHTML=''; d.hidden=false; h.textContent=L.watch;
    const ms=Math.max(560, 900-len*25); let i=0;
    const show=()=>{
      if(i>=seq.length){ d.hidden=true; phase='input'; kp.classList.remove('off'); h.textContent=`${L.yourTurn} · ${len}`; slots(); return; }
      d.textContent=seq[i]; bump(d,'in'); sfx.note(seq[i]); i++;
      api.later(()=>{ d.textContent=''; api.later(show,170); }, ms);
    };
    api.later(show,600);
  }
  function press(k){
    if(phase!=='input') return;
    if(k==='del'){ input.pop(); slots(); return; }
    input.push(+k); slots();
    if(input.length<seq.length) return;
    phase='check';
    if(input.every((v,i)=>v===seq[i])){
      s.classList.add('ok'); api.correct(len*10); len=Math.min(14,len+1); fails=0;
      api.later(round,750);
    } else {
      const go=api.wrong();
      s.innerHTML=seq.map((v,i)=>`<span class="slot ${input[i]===v?'filled':'miss'}">${v}</span>`).join(''); bump(s,'shake');
      if(go){ if(++fails>=2){ len=Math.max(3,len-1); fails=0; } api.later(round,1500); }
    }
  }
  bindKeypad(st, press); kp.classList.add('off'); round();
}

// 4) Constelación — memoria visoespacial (tipo Corsi)
function initGrid(st, api){
  const L=api.t(); let len=3, seq=[], pos=0, phase='show', fails=0, cells=[];
  st.innerHTML = `<div class="mid"><div class="hint" id="h"></div><div class="grid locked" id="g"></div></div>`;
  const h=$('#h',st), g=$('#g',st);
  function build(){
    const n = len>=5 ? 4 : 3; g.style.setProperty('--n',n);
    g.innerHTML = Array.from({length:n*n},(_,i)=>`<button class="cell" data-i="${i}" aria-label="${i+1}"></button>`).join('');
    cells=[...g.children]; cells.forEach(c=>c.onclick=()=>tap(+c.dataset.i));
    return n*n;
  }
  function round(){
    const total=build(); seq=[]; while(seq.length<len){ const c=ri(0,total-1); if(c!==seq[seq.length-1]) seq.push(c); }
    pos=0; phase='show'; g.classList.add('locked'); h.textContent=L.watch;
    const ms=Math.max(430, 680-len*20); let i=0;
    const step=()=>{
      if(i>=seq.length){ phase='input'; g.classList.remove('locked'); h.textContent=`${L.yourTurn} · ${len}`; return; }
      const c=cells[seq[i]]; c.classList.add('lit'); sfx.note(seq[i]);
      api.later(()=>{ c.classList.remove('lit'); i++; api.later(step,160); }, ms);
    };
    api.later(step,650);
  }
  function tap(i){
    if(phase!=='input') return;
    const c=cells[i];
    if(i===seq[pos]){
      c.classList.add('hit'); sfx.note(i); setTimeout(()=>c.classList.remove('hit'),220); pos++;
      if(pos===seq.length){ phase='check'; g.classList.add('locked'); api.correct(len*10); len=Math.min(12,len+1); fails=0; api.later(round,850); }
    } else {
      phase='check'; g.classList.add('locked'); c.classList.add('miss'); cells[seq[pos]].classList.add('lit'); bump(g,'shake');
      if(api.wrong()){ if(++fails>=2){ len=Math.max(3,len-1); fails=0; } api.later(round,1300); }
    }
  }
  round();
}

// 5) Anagramas
function initAnagram(st, api){
  const L=api.t(), words=shuffle([...L.words]); let wi=0, word='', tiles=[], built=[], lock=false;
  st.innerHTML = `<div class="mid"><div class="built" id="b"></div><div class="tiles" id="tl"></div></div>
    <div class="row2"><button class="btn ghost" id="del">${L.del}</button><button class="btn ghost" id="skip">${L.skip}</button></div>`;
  const b=$('#b',st), tl=$('#tl',st);
  function next(){
    word=words[wi++ % words.length]; let letters;
    do{ letters=shuffle(word.split('')); } while(letters.join('')===word);
    tiles=letters.map(ch=>({ch,used:false})); built=[]; b.className='built'; render();
  }
  function render(){
    b.innerHTML = word.split('').map((_,i)=>`<span class="slot ${built[i]!=null?'filled':''}">${built[i]!=null?tiles[built[i]].ch:''}</span>`).join('');
    tl.innerHTML = tiles.map((x,i)=>`<button class="tile ${x.used?'used':''}" data-i="${i}" ${x.used?'tabindex="-1"':''}>${x.ch}</button>`).join('');
    tl.querySelectorAll('.tile').forEach(el=>el.onclick=()=>add(+el.dataset.i));
  }
  function add(i){
    if(lock||tiles[i].used) return;
    tiles[i].used=true; built.push(i); sfx.tap(); render();
    if(built.length<word.length) return;
    lock=true;
    if(built.map(j=>tiles[j].ch).join('')===word){ b.classList.add('ok'); api.correct(word.length*4); api.later(()=>{ lock=false; next(); },550); }
    else { b.classList.add('bad'); bump(b,'shake'); api.wrong(); api.later(()=>{ lock=false; tiles.forEach(x=>x.used=false); built=[]; b.className='built'; render(); },650); }
  }
  function del(){ if(lock||!built.length) return; tiles[built.pop()].used=false; render(); }
  function skip(){
    if(lock) return; lock=true;
    b.innerHTML = word.split('').map(ch=>`<span class="slot miss">${ch}</span>`).join('');
    api.later(()=>{ lock=false; next(); },900);
  }
  $('#del',st).onclick=del; $('#skip',st).onclick=skip;
  api.key(e=>{
    if(e.key==='Backspace'){ e.preventDefault(); del(); return; }
    const ch=e.key.toUpperCase(); if(ch.length!==1) return;
    const i=tiles.findIndex(x=>!x.used && x.ch===ch); if(i>=0){ e.preventDefault(); add(i); }
  });
  next();
}

// 6) ¿Cuál es mayor?
function initCompare(st, api){
  let level=1, streak=0, A, B, lock=false;
  st.innerHTML = `<div class="mid"><div class="hint">${api.t().bigger}</div><div class="vs"><button class="opt" id="o0"></button><button class="opt" id="o1"></button></div></div>`;
  const o=[$('#o0',st),$('#o1',st)];
  function expr(){
    const kinds = level===1?['add'] : level===2?['add','mul'] : level===3?['mul','addmul'] : ['mul','addmul','mulsub'];
    const k=pick(kinds), r=level;
    if(k==='add'){ const a=ri(5,15+r*12), b=ri(5,15+r*12); return {s:`${a} + ${b}`, v:a+b}; }
    if(k==='mul'){ const a=ri(3,8+r), b=ri(3,8+r); return {s:`${a} × ${b}`, v:a*b}; }
    if(k==='addmul'){ const a=ri(2,9), b=ri(3,12), c=ri(2,30); return {s:`${a} × ${b} + ${c}`, v:a*b+c}; }
    const a=ri(4,12), b=ri(4,12), c=ri(2,30); return {s:`${a} × ${b} − ${c}`, v:a*b-c};
  }
  function next(){
    const maxDiff=[0,16,12,9,7,6][Math.min(level,5)]; let tries=0;
    do{ A=expr(); B=expr(); tries++; } while((A.v===B.v || Math.abs(A.v-B.v)>maxDiff) && tries<400);
    if(A.v===B.v) B={s:B.s.replace(/(\d+)$/,m=>+m+1), v:B.v+1};
    [A,B].forEach((x,i)=>{ o[i].className='opt'; o[i].innerHTML=`<span>${x.s}</span><small></small>`; });
  }
  function choose(i){
    if(lock) return; lock=true;
    const vals=[A.v,B.v], win=vals[0]>vals[1]?0:1;
    o.forEach((el,j)=>{ el.querySelector('small').textContent='= '+vals[j]; el.classList.add(j===win?'win':'lose'); });
    if(i===win){ api.correct(10); if(++streak>=3 && level<5){ level++; streak=0; } api.later(()=>{ lock=false; next(); },450); }
    else { bump(o[i],'shake'); api.wrong(); streak=0; level=Math.max(1,level-1); api.later(()=>{ lock=false; next(); },1000); }
  }
  o.forEach((el,i)=>el.onclick=()=>choose(i));
  api.key(e=>{ if(e.key==='ArrowLeft'||e.key==='1'){ e.preventDefault(); choose(0); } if(e.key==='ArrowRight'||e.key==='2'){ e.preventDefault(); choose(1); } });
  next();
}

// 7) Reglas — cambio de tarea (task switching)
function initSwitch(st, api){
  const L=api.t();
  const RULES={
    parity:{q:L.parityQ, a:[L.even,L.odd], color:'var(--d-math)', ans:n=>n%2===0?0:1},
    size:{q:L.sizeQ, a:[L.less,L.more], color:'var(--d-mem)', ans:n=>n<5?0:1}
  };
  let rule='parity', num=0, lock=false, switched=false, first=true;
  st.innerHTML = `<div class="mid"><div class="rule-card" id="rc"><span class="rule-chip" id="rq"></span><div class="rule-num" id="rn"></div></div></div>
    <div class="choices"><button class="choice" id="c0"></button><button class="choice" id="c1"></button></div>`;
  const rc=$('#rc',st), rq=$('#rq',st), rn=$('#rn',st), c=[$('#c0',st),$('#c1',st)];
  function next(){
    switched = !first && Math.random()<.4; first=false;
    if(switched) rule = rule==='parity'?'size':'parity';
    let n; do{ n=pick([1,2,3,4,6,7,8,9]); } while(n===num); num=n;
    const R=RULES[rule];
    rc.style.setProperty('--rc',R.color); rq.textContent=R.q; rn.textContent=num; bump(rc,'flash-ok');
    c.forEach((b,i)=>b.innerHTML=`${R.a[i]}<kbd>${i?'→':'←'}</kbd>`);
  }
  function choose(i){
    if(lock) return;
    pressFx(c[i]);
    if(RULES[rule].ans(num)===i){ api.correct(switched?15:10); next(); }
    else { lock=true; api.wrong(); bump(rc,'shake'); api.later(()=>{ lock=false; next(); },500); }
  }
  c.forEach((b,i)=>b.onclick=()=>choose(i));
  api.key(e=>{ if(e.key==='ArrowLeft'||e.key==='1'){ e.preventDefault(); choose(0); } if(e.key==='ArrowRight'||e.key==='2'){ e.preventDefault(); choose(1); } });
  next();
}

// 8) Eco — n-back adaptativo
function initNback(st, api){
  const L=api.t(), pool=shuffle('BCDFGHKLMNPRST'.split('')).slice(0,7);
  let n=1, seq=[], responded=false, hitsRow=0, errs=0, pendingN=null;
  st.innerHTML = `<div class="mid"><div class="hint" id="h"></div><div class="nb-card" id="c"></div><div class="nb-level" id="lv"></div><div class="nb-note" id="nt"></div></div>
    <button class="btn wide" id="m">${L.match}</button>`;
  const h=$('#h',st), card=$('#c',st), lv=$('#lv',st), nt=$('#nt',st), mb=$('#m',st);
  const level=()=>{ h.textContent=L.nbackQ(n); lv.innerHTML=`<span class="nb-dots">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>${L.nbackLevel(n)}`; };
  const isMatch=()=>seq.length>n && seq[seq.length-1]===seq[seq.length-1-n];
  function nextLetter(){
    if(seq.length>=n && Math.random()<.32) return seq[seq.length-n];
    let x; do{ x=pick(pool); } while(seq.length>=n && x===seq[seq.length-n]); return x;
  }
  function step(){
    // cerrar el estímulo anterior: si era coincidencia y no se pulsó, es un fallo
    if(isMatch() && !responded){ nt.textContent=L.nbackMiss; card.className='nb-card bad'; api.wrong(); errs++; hitsRow=0; if(errs>=3 && n>1){ pendingN=n-1; } }
    else nt.textContent='';
    if(pendingN){ n=pendingN; pendingN=null; seq=[]; errs=0; hitsRow=0; level(); }
    api.later(()=>{
      seq.push(nextLetter()); responded=false;
      card.className='nb-card'; card.textContent=seq[seq.length-1]; bump(card,'flash-ok'); sfx.blip();
      api.later(()=>{ card.textContent=''; }, 1600);
      api.later(step, 2300);
    }, 250);
  }
  function tap(){
    if(responded || seq.length<=n){ return; }
    responded=true; pressFx(mb);
    if(isMatch()){ card.className='nb-card ok'; api.correct(15*n); hitsRow++; if(hitsRow>=4 && n<3){ pendingN=n+1; } }
    else { card.className='nb-card bad'; bump(card,'shake'); api.wrong(); errs++; hitsRow=0; if(errs>=3 && n>1){ pendingN=n-1; } }
  }
  mb.onclick=tap;
  api.key(e=>{ if(e.key===' '||e.key==='Enter'||e.key.toLowerCase()==='m'){ e.preventDefault(); tap(); } });
  level(); api.later(step,400);
}

// 9) Espejo — rotación mental con poliominós
function initRotate(st, api){
  const L=api.t(); let level=1, streak=0, same=true, lock=false;
  st.innerHTML = `<div class="mid"><div class="hint">${L.mirrorQ}</div><div class="shapes"><div class="shape-box" id="s0"></div><div class="shape-box" id="s1"></div></div></div>
    <div class="choices"><button class="choice" id="c0">${L.same}<kbd>←</kbd></button><button class="choice" id="c1">${L.mirror}<kbd>→</kbd></button></div>`;
  const box=[$('#s0',st),$('#s1',st)], c=[$('#c0',st),$('#c1',st)];
  const K=(x,y)=>x+','+y;
  const norm=cs=>{ const mx=Math.min(...cs.map(p=>p[0])), my=Math.min(...cs.map(p=>p[1])); return cs.map(([x,y])=>K(x-mx,y-my)).sort().join(';'); };
  const rot=cs=>cs.map(([x,y])=>[-y,x]), mir=cs=>cs.map(([x,y])=>[-x,y]);
  function chiral(cs){ const m=norm(mir(cs)); let r=cs; for(let i=0;i<4;i++){ if(norm(r)===m) return false; r=rot(r); } return true; }
  function poly(n){
    for(;;){
      const cs=[[0,0]], set=new Set([K(0,0)]);
      while(cs.length<n){ const [x,y]=pick(cs), [dx,dy]=pick([[1,0],[-1,0],[0,1],[0,-1]]); if(!set.has(K(x+dx,y+dy))){ set.add(K(x+dx,y+dy)); cs.push([x+dx,y+dy]); } }
      if(chiral(cs)) return cs;
    }
  }
  function svg(cs, angle){
    const xs=cs.map(p=>p[0]), ys=cs.map(p=>p[1]);
    const cx=(Math.min(...xs)+Math.max(...xs)+1)/2, cy=(Math.min(...ys)+Math.max(...ys)+1)/2;
    const R=Math.max(...cs.map(([x,y])=>Math.hypot(x+.5-cx,y+.5-cy)))+.75;
    const cells=cs.map(([x,y])=>`<rect x="${x+.05}" y="${y+.05}" width=".9" height=".9" rx=".14" fill="var(--d-space)"/>`).join('');
    return `<svg viewBox="${cx-R} ${cy-R} ${2*R} ${2*R}" aria-hidden="true"><g transform="rotate(${angle} ${cx} ${cy})">${cells}</g></svg>`;
  }
  function next(){
    const cs=poly(level<=2?5:6);
    same=Math.random()<.5;
    const angles = level===1?[90,180,270] : level===2?[45,90,135,180,225,270,315] : [30,60,90,120,150,180,210,240,270,300,330];
    const base = level>=4 ? pick([0,30,60,90]) : 0;
    box[0].innerHTML=svg(cs,base);
    box[1].innerHTML=svg(same?cs:mir(cs), base+pick(angles));
    box.forEach(b=>b.className='shape-box');
  }
  function choose(i){
    if(lock) return; lock=true; pressFx(c[i]);
    const ok = (i===0)===same;
    box.forEach(b=>b.classList.add(ok?'ok':'bad'));
    if(ok){ api.correct(10+3*(level-1)); if(++streak>=3 && level<4){ level++; streak=0; } api.later(()=>{ lock=false; next(); },380); }
    else { bump(box[1],'shake'); api.wrong(); streak=0; level=Math.max(1,level-1); api.later(()=>{ lock=false; next(); },800); }
  }
  c.forEach((b,i)=>b.onclick=()=>choose(i));
  api.key(e=>{ if(e.key==='ArrowLeft'||e.key==='1'){ e.preventDefault(); choose(0); } if(e.key==='ArrowRight'||e.key==='2'){ e.preventDefault(); choose(1); } });
  next();
}

// ---------- confeti ----------
function confetti(n){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.hidden=false;
  const W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  const css=getComputedStyle(document.documentElement);
  const cols=['--accent','--d-math','--d-attn','--d-mem','--d-lang','--d-space'].map(v=>css.getPropertyValue(v).trim()||'#f60');
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*W*.018, vy:-Math.random()*H*.022-H*.006, r:(4+Math.random()*5)*devicePixelRatio, a:Math.random()*6, va:(Math.random()-.5)*.3, c:pick(cols)}));
  const t0=performance.now();
  (function f(now){
    const el=now-t0; x.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=H*.0007; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.globalAlpha=Math.max(0,1-el/1800); x.fillStyle=p.c; x.fillRect(-p.r,-p.r*.5,p.r*2,p.r); x.restore(); });
    if(el<1800) requestAnimationFrame(f); else { x.clearRect(0,0,W,H); c.hidden=true; }
  })(t0);
}

$('#lang').onchange=e=>{ S.lang=e.target.value; save(); renderTop(); if(view==='stats') renderStats(); else renderHome(); };
$('#soundBtn').onclick=()=>{ S.sound=!S.sound; save(); renderTop(); if(S.sound) sfx.tap(); };
$('#tabHome').onclick=()=>{ sfx.tap(); goHome(); };
$('#tabStats').onclick=()=>{ sfx.tap(); goStats(); };
$('#quit').onclick=goHome;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !play.hidden){ goHome(); return; }
  if(run && run.phase==='game' && run.onKey){ run.onKey(e); return; }
  if(run && run.phase==='intro' && e.key==='Enter' && document.activeElement?.id!=='go'){ e.preventDefault(); startRun(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden && sfx.ctx) sfx.ctx.suspend?.(); });
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(view==='stats') drawLine(); },150); });

renderTop();
if(location.hash==='#progreso' || location.hash==='#stats'){ renderStats(); showView('stats'); }
else { renderHome(); showView('home'); }
